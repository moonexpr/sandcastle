[package]
name = "foundation"
version = "0.1.0"
edition = "2021"
description = "Sandcastle's foundation structures and algorithms, native: the Lua modules' backing on the server"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["entry"]
# The module's exported entry points (gmod13_open, luaopen_foundation)
entry = []

[profile.release]
# A Lua error unwinds through Rust frames (C-unwind); panic = "abort" would
# turn that unwind into an abort, so pcall could never catch a refusal.
panic = "unwind"
lto = true
