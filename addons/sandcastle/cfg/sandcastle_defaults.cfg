// Sandcastle's convars at their defaults: run ws_defaults_apply on the
// server (ws/sv_defaults.lua). exec cannot reach it: GMod's exec reads
// only garrysmod/cfg/, never an addon's cfg/ folder.
//
// Run it after a map has loaded. Each map loads only the systems its
// entities pull in, and a system creates its convars when it loads, so the
// convars of systems this map did not load print "Unknown command" and are
// left alone. Client convars at the end exist only on clients, so the
// server reports them unknown; a client sets its own from its console.
// tests/cfg_defaults_test.lua keeps every value here equal to the default
// in the code.

// Gameplay and Sandbox mode
sv_gameplay_enabled "0"
sv_gameplay_disable_sandbox "0"
mp_waitingforplayers "1"
sv_idle_delay "300"
mp_tampering_enabled "1"
mp_economy_enabled "0"
mp_economy_credit_enabled "0"
ns_soldiers_enabled "1"
tf_weapon_criticals "1"
mp_friendlyfire "0"
tf_use_fixed_weaponspreads "0"

// Round control
mp_round_reward_money "0"

// Reports and votes
mp_reports_kick_count "3"
mp_vote_duration "20"
mp_vote_cooldown "120"
mp_vote_map_enabled "1"
mp_vote_reset_enabled "1"
mp_vote_scramble_enabled "1"
mp_vote_support_enabled "1"
mp_vote_difficulty_enabled "1"
mp_vote_nextmap_enabled "1"

// Teams and spectating
mp_autoteambalance "1"
mp_teams_unbalance_limit "1"
mp_forceautoteam "0"
mp_allowspectators "1"
mp_forcecamera "1"
tf_player_movement_restart_freeze "1"

// Rounds
mp_respawnwavetime "10.0"
mp_bonusroundtime "15"
mp_enableroundwaittime "1"
mp_stalemate_enable "0"
mp_deathmatch_enable "1"
mp_stalemate_timelimit "240"
mp_winlimit "0"
mp_maxrounds "0"
mp_timelimit "30"
// each map sets mp_winlimit and mp_maxrounds to TF2's casual ones for its
// kind: first to 2 wins, 2 rounds of stopwatch, or 1 round (CTF, a race in stages)
mp_casual_win_conditions "1"
mp_match_end_at_timelimit "1"
mp_chattime "10"
mp_maplist_enabled "0"
mp_scrambleteams_auto "1"
mp_scrambleteams_auto_windifference "2"
// round limits, on maps without an objective (frags decide first)
mp_round_fraglimit "30"
mp_round_cashlimit "10000"
tf_overtime_nag "0"

// Arena (maps with a tf_logic_arena)
mp_arena_preround_time "10"
mp_arena_round_time "0"
mp_arena_override_cap_enable_time "-1"

// Control points
tf_caplinear "1"
mp_capstyle "1"
mp_blockstyle "1"
mp_capdeteriorate_time "90.0"

// Payload
tf_escort_recede_time "30"
tf_escort_recede_time_overtime "5"

// Capture the flag (maps with an item_teamflag)
tf_flag_caplimit "3"
// The capturing team's crits after a capture, in seconds (0: none)
tf_ctf_bonus_time "10"

// Mann vs. Machine (maps with a tf_logic_mann_vs_machine): setup before
// the wave, standing in for the ready-up (0: the map's own)
ws_mvm_setup_time "30"

// Holidays
tf_forced_holiday "0"
tf_spells_enabled "0"

// AI node graph
ws_nodegraph_max_nodes "1500"

// AI war
mp_aiwar_team_size "8"
mp_aiwar_autostart "0"
ws_aiwar_sitting_enabled "1"
// how well the soldiers shoot: 0 easy, 1 normal, 2 hard, 3 expert
tf_bot_difficulty "1"
// bot players fighting as soldiers while the war runs: how many, counted as the mode says
tf_bot_quota "0"
tf_bot_quota_mode "normal"
tf_bot_join_after_player "1"
ns_soldiers_paused "0"
ns_use_regular_spawns "0"
ns_squads_auto_enabled "1"
ns_squads_max "3"
ns_squads_min "3"
// route searches: a goal out of reach known from the regions failed searches walked
ns_routes_reach "1"

// NextSoldier: the tactics constants (ns_tactics_list) back to their defaults
ws_aiwar_debug_full "0"
ns_tactics_reset

// Analytics: per-tick pressure and Lua memory (ws_analytics_print)
ws_analytics "0"
// player analytics: SteamID64s left out (the developers'; set in the server's own server.cfg)
ws_analytics_exclude ""
ws_jit_enabled "1"

