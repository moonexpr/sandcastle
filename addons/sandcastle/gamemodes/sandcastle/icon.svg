<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sandcastle's icon: the master copy. icon24.png and logo.png are rendered
  from it by .devtools/bin/gamemode_art.py; edit this, then run that.

  Drawn in the style of the Silk icon set by Mark James
  (famfamfam.com/lab/icons/silk, CC BY 2.5): a 16x16 pixel grid, a 1px
  outline darkening from the top left, a fill lit from the top left, and a
  lighter inner left edge. Its colours are Silk's own: box.png's for the
  sand, flag_red.png's for the flag and pole.

  Every shape sits on whole pixels (crispEdges), as Silk's do.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <defs>
    <!-- box.png: its outline, #96621f at the top left to #784d15 at the bottom right -->
    <linearGradient id="outline" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="16" y2="16">
      <stop offset="0" stop-color="#a87a3f"/>
      <stop offset="0.35" stop-color="#96621f"/>
      <stop offset="1" stop-color="#784d15"/>
    </linearGradient>
    <!-- box.png: its fill, #f4cc8f lit at the top left to #c86530 at the bottom right -->
    <linearGradient id="sand" gradientUnits="userSpaceOnUse" x1="0" y1="4" x2="16" y2="14">
      <stop offset="0" stop-color="#f4cc8f"/>
      <stop offset="0.4" stop-color="#e5a957"/>
      <stop offset="1" stop-color="#c86530"/>
    </linearGradient>
    <!-- flag_red.png: its cloth -->
    <linearGradient id="cloth" gradientUnits="userSpaceOnUse" x1="9" y1="0" x2="13" y2="3">
      <stop offset="0" stop-color="#ffa29b"/>
      <stop offset="0.5" stop-color="#ff5b50"/>
      <stop offset="1" stop-color="#e91e0b"/>
    </linearGradient>
  </defs>

  <!-- the beach: a strip of sand under the castle, as Silk's house stands on grass -->
  <g id="beach">
    <rect x="0" y="14" width="16" height="1" fill="#f0d29b"/>
    <rect x="1" y="15" width="14" height="1" fill="#d9a55a"/>
  </g>

  <!-- the castle's outline: the whole silhouette, which the fill covers but for its edge -->
  <g id="outline-shape" fill="url(#outline)">
    <!-- the left tower, its two merlons -->
    <rect x="1" y="6" width="5" height="8"/>
    <rect x="1" y="4" width="2" height="2"/>
    <rect x="4" y="4" width="2" height="2"/>
    <!-- the right tower, its two merlons -->
    <rect x="10" y="6" width="5" height="8"/>
    <rect x="10" y="4" width="2" height="2"/>
    <rect x="13" y="4" width="2" height="2"/>
    <!-- the wall between them, its merlon -->
    <rect x="6" y="8" width="4" height="6"/>
    <rect x="7" y="7" width="2" height="1"/>
  </g>

  <!-- the castle's fill: the silhouette one pixel in -->
  <g id="fill-shape" fill="url(#sand)">
    <rect x="2" y="6" width="1" height="1"/>
    <rect x="4" y="6" width="1" height="1"/>
    <rect x="11" y="6" width="1" height="1"/>
    <rect x="13" y="6" width="1" height="1"/>
    <rect x="2" y="7" width="3" height="1"/>
    <rect x="11" y="7" width="3" height="1"/>
    <rect x="2" y="8" width="4" height="1"/>
    <rect x="7" y="8" width="2" height="1"/>
    <rect x="10" y="8" width="4" height="1"/>
    <rect x="2" y="9" width="12" height="4"/>
  </g>

  <!-- box.png's lighter inner left edge -->
  <g id="highlight" fill="#eecc8f">
    <rect x="2" y="6" width="1" height="7"/>
    <rect x="11" y="6" width="1" height="2"/>
    <rect x="7" y="8" width="1" height="1"/>
  </g>

  <!-- the gate, open through the wall -->
  <g id="gate">
    <rect x="7" y="10" width="2" height="4" fill="#7a4c12"/>
    <rect x="7" y="10" width="1" height="1" fill="#5c3a0e"/>
  </g>

  <!-- the flag on the wall's merlon: flag_red.png's pole and cloth -->
  <g id="flag">
    <rect x="8" y="0" width="1" height="7" fill="#87581d"/>
    <rect x="9" y="0" width="4" height="3" fill="#c43327"/>
    <rect x="9" y="1" width="3" height="1" fill="url(#cloth)"/>
  </g>
</svg>
